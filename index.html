async function sGet(k, f) {
  try {
    const { data, error } = await supa.from("donnees").select("valeur").eq("carnet_id", CARNET).eq("cle", k).maybeSingle();
    if (error) throw error;
    return data ? data.valeur : f;
  } catch { return f; }
}
async function sSet(k, v) {
  const { error } = await supa.from("donnees")
    .upsert({ carnet_id: CARNET, cle: k, valeur: v, maj: new Date().toISOString() }, { onConflict: "carnet_id,cle" });
  if (error) throw error;
}
async function sDel(k) {
  await supa.from("donnees").delete().eq("carnet_id", CARNET).eq("cle", k);

/* ---------------------------------- Claude, avec ta clé */
function cle() { return (localStorage.getItem(K_CLE) || "").trim(); }
async function claude(messages) {
  const k = cle();
  if (!k) throw new Error("no-key");
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": k,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages }),
  });
  if (!r.ok) throw new Error("api-" + r.status);
  const d = await r.json();
  const txt = (d.content||[]).map(i => i.type === "text" ? i.text : "").join("\n");
  return JSON.parse(txt.replace(/```json|```/g,"").trim());
}

/* ---------------------------------- calculs */
function verse(entrees, id) {
  return entrees.filter(e => e.type === "depense" && e.lie === id).reduce((s,e) => s + N(e.montant), 0);
}
function chiffrer(entrees, poste) {
  const dans = (e) => !poste || e.poste === poste;
  let paye = 0, engage = 0;
  entrees.forEach(e => {
    if (e.type === "depense" && dans(e)) paye += N(e.montant);
    if (e.type === "devis" && e.statut === "signe" && dans(e)) engage += Math.max(0, N(e.montant) - verse(entrees, e.id));
  });
  return { paye, engage, total: paye + engage };
}

/* ---------------------------------- graphiques maison */
function arc(a0, a1, ri, ro, c) {
  const grand = (a1 - a0) > Math.PI ? 1 : 0;
  const P = (r,a) => [(c + r*Math.cos(a)).toFixed(2), (c + r*Math.sin(a)).toFixed(2)];
  const [x0,y0]=P(ro,a0), [x1,y1]=P(ro,a1), [x2,y2]=P(ri,a1), [x3,y3]=P(ri,a0);
  return `M${x0},${y0}A${ro},${ro} 0 ${grand} 1 ${x1},${y1}L${x2},${y2}A${ri},${ri} 0 ${grand} 0 ${x3},${y3}Z`;
}
function Donut({ data, size = 150 }) {
  const total = data.reduce((s,d) => s + d.total, 0);
  const c = size/2, ri = size*0.29, ro = size*0.48;
  if (!total) return null;
  if (data.length === 1) return (
    <svg width={size} height={size}>
      <circle cx={c} cy={c} r={(ri+ro)/2} fill="none" stroke={data[0].couleur} strokeWidth={ro-ri} />
    </svg>
  );
  let acc = 0;
  return (
    <svg width={size} height={size} role="img" aria-label="Répartition des dépenses par poste">
      {data.map(d => {
        const a0 = (acc/total)*2*Math.PI - Math.PI/2;
        acc += d.total;
        const a1 = (acc/total)*2*Math.PI - Math.PI/2;
        return <path key={d.nom} d={arc(a0, a1 - 0.012, ri, ro, c)} fill={d.couleur}>
          <title>{`${d.nom} — ${eur(d.total)}`}</title>
        </path>;
      })}
    </svg>
  );
}
function BarreEmpilee({ data }) {
  const total = data.reduce((s,b) => s + b.val, 0) || 1;
  return (
    <div style={{ display:"flex", height:28, borderRadius:999, overflow:"hidden", border:`1.5px solid ${C.trait}` }}>
      {data.map(b => (
        <div key={b.nom} title={`${b.nom} — ${eur(b.val)}`}
          style={{ width:`${(b.val/total)*100}%`, background:b.couleur }} />
      ))}
    </div>
  );
}

      try {
        const list = await sGet(kEntrees(v.id), []);
        const suite = list.map(e => (e.ref === "26DK05994" && e.type === "devis" && !e.echeance)
          ? { ...e, echeance: "2026-09-11" } : e);
        await sSet(kEntrees(v.id), suite);
        v.maj = 10;
        await sSet(K_PROJETS, p);
      } catch { setErreur("L'échéance du solde Schmidt n'a pas pu être inscrite."); }
    }
    setProjets(p); setActif(p[0].id);
  })(); }, []);

  useEffect(() => { if (actif) (async () => setEntrees(await sGet(kEntrees(actif), [])))(); }, [actif]);

  // Ce que Thomas écrit arrive ici tout seul.
  useEffect(() => {
    if (!supa || !CARNET) return;
    const ch = supa.channel("cdc-" + CARNET)
      .on("postgres_changes",
        { event: "*", schema: "public", table: "donnees", filter: "carnet_id=eq." + CARNET },
        async (p) => {
          const k = (p.new && p.new.cle) || (p.old && p.old.cle);
          if (!k) return;
          if (k === K_PROJETS) setProjets(await sGet(K_PROJETS, []));
          else if (actif && k === kEntrees(actif)) setEntrees(await sGet(kEntrees(actif), []));
        })
      .subscribe();
    return () => { supa.removeChannel(ch); };
  }, [actif]);

  const projet = projets?.find(p => p.id === actif);

  useEffect(() => {
    if (!projet) return;
    const valides = projet.type === "patrimoine"
      ? ["avoirs", "repartition", "projets"]
      : projet.type === "courses"
      ? ["courses", "projets"]
      : ["journal", "budget", "bilan", "projets"];
    if (!valides.includes(onglet)) setOnglet(valides[0]);
  }, [projet?.type]);

  const postes = useMemo(() => {
    if (!projet) return [];
    const k = Object.keys(projet.prevus || {});
    return k.length ? k : (POSTES_DEFAUT[projet.type] || POSTES_DEFAUT.libre);
  }, [projet]);

  const majProjet = async (patch) => {
    const next = projets.map(p => p.id === actif ? { ...p, ...patch } : p);
    setProjets(next);
    try { await sSet(K_PROJETS, next); } catch { setErreur("Enregistrement impossible."); }
  };
  const majProjets = async (next) => {
    setProjets(next);
    try { await sSet(K_PROJETS, next); } catch { setErreur("Enregistrement impossible."); }
  };
  const majEntrees = async (next) => {
    setEntrees(next);
    try { await sSet(kEntrees(actif), next); }
    catch { setErreur("Enregistrement impossible — le stockage est peut-être plein. Retire une pièce jointe lourde."); }
  };

  if (!projets) return <div className="cdc" style={{ display:"grid", placeItems:"center", height:"100vh" }}>
    <style>{CSS}</style><div className="eyebrow">Carnet de chantier</div></div>;

  const estPat = projet?.type === "patrimoine";
  const estCourses = projet?.type === "courses";
  const plafond = N(projet?.plafond);
  const t = chiffrer(entrees);
  const reste = plafond - t.total;

  return (
    <div className="cdc">
      <style>{CSS}</style>
      <div className="wrap">
        {estPat
          ? <PatrimoineHero projets={projets} actif={actif} setActif={setActif} comptes={projet.comptes || []} />
          : estCourses
          ? <CoursesHero projets={projets} actif={actif} setActif={setActif} entrees={entrees} />
          : <Decompte projets={projets} actif={actif} setActif={setActif} plafond={plafond} t={t} reste={reste} />}
        {erreur && (
          <div className="card" style={{ padding:12, marginBottom:12, borderColor:C.brique, background:C.briquePale, fontSize:13 }}>
            {erreur} <button className="btn-ghost" style={{ padding:"4px 10px", marginLeft:6 }} onClick={()=>setErreur("")}>Fermer</button>
          </div>
        )}
        <div className="tabs" role="tablist" style={{ marginBottom:14 }}>
          { (estPat
            ? [["avoirs", "Avoirs"], ["repartition", "Répartition"], ["projets", "Projets"]]
            : estCourses
            ? [["courses", "Courses"], ["projets", "Projets"]]
            : [["journal", "Journal"], ["budget", "Budget"], ["bilan", "Bilan"], ["projets", "Projets"]]).map(([k,l]) => (
            <button key={k} role="tab" aria-selected={onglet===k} className="tab" onClick={()=>setOnglet(k)}
              style={onglet===k ? { background: COUL_ONGLET[k] } : undefined}>{l}</button>
          ))}
        </div>
        {onglet === "avoirs" && <Avoirs projet={projet} majProjet={majProjet} />}
        {onglet === "repartition" && <Repartition projet={projet} />}
        {onglet === "courses" && <Courses entrees={entrees} majEntrees={majEntrees} />}
        {onglet==="journal" && <Journal entrees={entrees} postes={postes} onOuvrir={setEditeur} />}
        {onglet==="budget" && <Budget projet={projet} postes={postes} entrees={entrees} plafond={plafond} majProjet={majProjet} />}
        {onglet==="bilan" && <Bilan projet={projet} entrees={entrees} plafond={plafond} majProjet={majProjet} />}
        {onglet==="projets" && <Projets projets={projets} actif={actif} setActif={setActif} maj={majProjets}
          entrees={entrees} projet={projet} majProjet={majProjet} setErreur={setErreur}
          onDeco={onDeco} onChangerCarnet={onChangerCarnet} />}
      </div>

      {onglet==="journal" && !estPat && !estCourses && (
        <div style={{ position:"fixed", left:0, right:0, bottom:0, padding:"14px 14px calc(14px + env(safe-area-inset-bottom))",
          background:`linear-gradient(transparent, ${C.platre} 40%)` }}>
          <div style={{ maxWidth:780, margin:"0 auto" }}>
            <button className="btn-blue" style={{ width:"100%", padding:15 }} onClick={()=>setEditeur({id:null})}>
              Noter une dépense
            </button>
          </div>
        </div>
      )}

      {editeur && projet && (
        <Editeur
          entree={editeur.id ? entrees.find(e=>e.id===editeur.id) : null}
          postes={postes} entrees={entrees}
          devis={entrees.filter(e => e.type==="devis" && e.statut==="signe" && e.id!==editeur.id)}
          onFermer={()=>setEditeur(null)}
          onEnregistrer={async (e) => {
            const next = editeur.id ? entrees.map(x=>x.id===e.id?e:x) : [e, ...entrees];
            next.sort((a,b)=>a.date<b.date?1:-1);
            await majEntrees(next); setEditeur(null);
          }}
          onSupprimer={async (id) => {
            await majEntrees(entrees.filter(x=>x.id!==id));
            try { await sDel(kPhoto(id)); } catch {}
            setEditeur(null);
          }}
        />
      )}
    </div>
  );
}

/* ---------------------------------- Décompte */
// Trois états, trois couleurs franches. Blanc : parti. Jaune : promis. Transparent : libre.
const PAYE = "#FFFFFF";
const ENGAGE = "#F5C645";

function Decompte({ projets, actif, setActif, plafond, t, reste }) {
  const over = plafond > 0 && t.total > plafond;
  const base = Math.max(plafond, t.total, 1);
  const pc = plafond > 0 ? Math.round((t.total / plafond) * 100) : 0;
  const pcPaye = Math.min(100, (t.paye / base) * 100);
  const pcEng = Math.max(0, Math.min(100 - pcPaye, (t.engage / base) * 100));

  return (
    <header style={{ padding: "22px 0 18px" }}>
      <div className="eyebrow">Carnet de chantier</div>
      <select className="field" value={actif} onChange={e => setActif(e.target.value)}
        style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 26,
          letterSpacing: "-.03em", border: 0, background: "transparent", padding: 0,
          width: "auto", maxWidth: "100%", margin: "6px 0 20px" }}>
        {projets.map(p => <option key={p.id} value={p.id}>{p.nom}</option>)}
      </select>

      <div style={{
        padding: 20, borderRadius: 20, color: "#fff",
        background: over
          ? `linear-gradient(160deg, #E86A48 0%, ${C.brique} 55%, #B94427 100%)`
          : `linear-gradient(160deg, #3585D6 0%, ${C.cordeau} 55%, #14508F 100%)`,
        boxShadow: `0 16px 34px -16px ${over ? "rgba(222,91,59,.8)" : "rgba(30,111,191,.75)"}`,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10, marginBottom: 2 }}>
          <span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 15, color: "rgba(255,255,255,.9)" }}>
            {plafond === 0 ? "Total engagé" : over ? "Dépassement du plafond" : "Reste à engager"}
          </span>
          <span className="num" style={{ fontSize: 13, color: "rgba(255,255,255,.85)", whiteSpace: "nowrap" }}>
            {plafond > 0 ? `${pc} % de ${eurCourt(plafond)}` : "aucun plafond"}
          </span>
        </div>

        <div style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 48,
          letterSpacing: "-.04em", lineHeight: 1.05, color: "#fff", marginBottom: 18, fontVariantNumeric: "tabular-nums" }}>
          {eurCourt(plafond === 0 ? t.total : Math.abs(reste))}
        </div>

        <div style={{ position: "relative", height: 30, borderRadius: 999,
          background: "rgba(255,255,255,.22)", border: "2px solid rgba(255,255,255,.45)", overflow: "hidden" }}>
          <div style={{ position: "absolute", top: 0, bottom: 0, left: 0, width: `${pcPaye}%`, background: PAYE }} />
          <div style={{ position: "absolute", top: 0, bottom: 0, left: `${pcPaye}%`, width: `${pcEng}%`,
            background: ENGAGE, borderLeft: pcPaye > 0 && pcEng > 0 ? "2px solid rgba(22,50,79,.35)" : "none" }} />
          {over && <div style={{ position: "absolute", top: -2, bottom: -2, left: `${(plafond / base) * 100}%`,
            width: 3, background: C.ardoise }} />}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginTop: 16 }}>
          <Bloc couleur={PAYE} label="Payé" val={t.paye} />
          <Bloc couleur={ENGAGE} label="Engagé" val={t.engage} fort />
          <Bloc couleur="rgba(255,255,255,.28)" label="Disponible" val={Math.max(0, reste)} />
        </div>
      </div>
    </header>
  );
}

function Bloc({ couleur, label, val, fort }) {
  return (
    <div style={{
      background: "rgba(255,255,255,.15)", borderRadius: 12, padding: "10px 11px",
      border: fort ? `2px solid ${ENGAGE}` : "2px solid transparent",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 5 }}>
        <span style={{ width: 14, height: 14, borderRadius: 5, background: couleur, flexShrink: 0,
          border: "1px solid rgba(255,255,255,.5)" }} />
        <span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700,
          fontSize: 13, color: "rgba(255,255,255,.9)" }}>{label}</span>
      </div>
      <div className="num" style={{ fontSize: 18, fontWeight: 500, color: fort ? ENGAGE : "#fff", letterSpacing: "-.03em" }}>
        {eurCourt(val)}
      </div>
    </div>
  );
}

/* ---------------------------------- Journal */
const couleurPoste = (postes, nom) => SERIE[(Math.max(0, postes.indexOf(nom))) % SERIE.length];

// Une échéance n'a de sens que sur un devis signé qui a encore un solde à payer.
function Echeances({ entrees, postes, onOuvrir }) {
  const lignes = entrees
    .filter(e => e.type === "devis" && e.statut === "signe" && e.echeance)
    .map(e => ({ e, solde: N(e.montant) - verse(entrees, e.id), j: joursJusque(e.echeance) }))
    .filter(x => x.solde > 0)
    .sort((a, b) => a.e.echeance < b.e.echeance ? -1 : 1);

  if (!lignes.length) return null;

  return (
    <div className="card" style={{ marginBottom: 12 }}>
      <div style={{ padding: "13px 14px", borderBottom: `1px solid ${C.trait}` }}>
        <span className="eyebrow">Échéances à venir</span>
      </div>
      {lignes.map(({ e, solde, j }) => {
        const col = couleurPoste(postes, e.poste);
        const retard = j < 0, bientot = j >= 0 && j <= 30;
        const teinte = retard ? C.brique : bientot ? C.ocre : C.mine;
        return (
          <button key={e.id} className="row" onClick={() => onOuvrir({ id: e.id })}>
            <span className="bande" style={{ background: col }} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
                <span style={{ flex: 1, minWidth: 0, fontSize: 15.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {e.libelle || "Sans libellé"}
                </span>
                <span className="num" style={{ fontSize: 16, fontWeight: 500, flexShrink: 0 }}>{eurCourt(solde)}</span>
              </span>
              <span style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 6, flexWrap: "wrap" }}>
                <span className="pill" style={{ background: teinte + "22", color: teinte }}>
                  {retard ? `En retard de ${-j} j` : `${jour(e.echeance)} · ${j===0 ? "aujourd'hui" : `dans ${j} j`}`}
                </span>
              </span>
            </span>
          </button>
        );
      })}
    </div>
  );
}

function Journal({ entrees, postes, onOuvrir }) {
  const [q, setQ] = useState("");
  const filtre = entrees.filter(e => !q || [e.libelle, e.fournisseur, e.poste].join(" ").toLowerCase().includes(q.toLowerCase()));

  if (!entrees.length) return (
    <div className="card" style={{ padding: 32, textAlign: "center" }}>
      <div className="h2" style={{ marginBottom: 8, fontSize: 18 }}>Le carnet est vierge</div>
      <p style={{ fontSize: 15, color: C.mine, margin: "0 auto", maxWidth: 380, lineHeight: 1.6 }}>
        Note ta première dépense. Dicte avec le micro de ton clavier, ou joins la facture.
      </p>
    </div>
  );

  return (
    <>
      <Echeances entrees={entrees} postes={postes} onOuvrir={onOuvrir} />
      <input className="field" placeholder="Rechercher un libellé, un fournisseur, un poste"
        value={q} onChange={e => setQ(e.target.value)} style={{ marginBottom: 12 }} />
      <div className="card">
        {filtre.map(e => {
          const col = couleurPoste(postes, e.poste);
          const v = e.type === "devis" && e.statut === "signe" ? verse(entrees, e.id) : 0;
          const solde = N(e.montant) - v;
          const parent = e.lie ? entrees.find(x => x.id === e.lie) : null;
          return (
            <button key={e.id} className="row" onClick={() => onOuvrir({ id: e.id })} style={{ gap: 12, padding: "16px 14px", alignItems: "stretch", background: col + "0D" }}>
              <span className="bande" style={{ background: col, width: 7 }} />
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
                  <span style={{ flex: 1, minWidth: 0, fontSize: 18, fontWeight: 600, letterSpacing: "-.015em", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {e.libelle || "Sans libellé"}
                  </span>
                  <span className="num" style={{ fontSize: 19, fontWeight: 500, flexShrink: 0, color: e.type === "devis" ? C.mine : C.ardoise }}>
                    {eur(N(e.montant))}
                  </span>
                </span>

                <span style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 7, flexWrap: "wrap" }}>
                  <span className="pill" style={{ background: col + "22", color: col }}>{e.poste}</span>
                  {e.type === "devis" && (
                    <span className="pill" style={{
                      background: e.statut === "signe" ? C.ardoise : "transparent",
                      color: e.statut === "signe" ? "#fff" : C.mine,
                      border: e.statut === "signe" ? "none" : `1.5px solid ${C.trait}`,
                    }}>{e.statut === "signe" ? "Devis signé" : "Devis en attente"}</span>
                  )}
                  {parent && <span className="pill" style={{ background: C.vert + "22", color: C.vert }}>Acompte</span>}
                  {e.photo && <span className="pill" style={{ background: C.ocre + "26", color: "#9A6614" }}>Pièce jointe</span>}
                  <span className="num" style={{ fontSize: 14, color: C.mine }}>{jour(e.date)}</span>
                  {e.fournisseur && (
                    <span style={{ fontSize: 14.5, color: C.mine, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      · {e.fournisseur}
                    </span>
                  )}
                </span>

                {v > 0 && (
                  <span style={{ display: "block", marginTop: 8 }}>
                    <span className="jauge" style={{ height: 7, display: "block" }}>
                      <span className="jauge-paye" style={{ background: col, width: `${Math.min(100, (v / N(e.montant)) * 100)}%` }} />
                    </span>
                    <span className="num" style={{ fontSize: 12, color: solde <= 0 ? C.vert : C.mine, display: "block", marginTop: 5 }}>
                      {eurCourt(v)} versés · {solde <= 0 ? "soldé" : `${eurCourt(solde)} restants`}
                    </span>
                  </span>
                )}
              </span>
            </button>
          );
        })}
        {!filtre.length && <div style={{ padding: 28, textAlign: "center", fontSize: 14, color: C.mine }}>Aucune écriture ne correspond.</div>}
      </div>
    </>
  );
}

/* ---------------------------------- Budget */
const COUL_ONGLET = { journal: "#1E6FBF", budget: "#12A594", bilan: "#E9A13B", projets: "#D4587A",
  avoirs: "#7C5CBF", repartition: "#12A594", courses: "#6F9440" };

function Budget({ projet, postes, entrees, plafond, majProjet }) {
  const [nouveau, setNouveau] = useState("");
  const affecte = postes.reduce((s, p) => s + N(projet.prevus?.[p]), 0);
  const ecart = plafond - affecte;
  const setPrevu = (poste, v) => majProjet({ prevus: { ...projet.prevus, [poste]: v.replace(",", ".") } });
  const ajouter = () => { const n = nouveau.trim(); if (!n || postes.includes(n)) return;
    majProjet({ prevus: { ...projet.prevus, [n]: "" } }); setNouveau(""); };
  const retirer = (poste) => { const p = { ...projet.prevus }; delete p[poste]; majProjet({ prevus: p }); };
  const donnees = postes.map((p, i) => ({ ...chiffrer(entrees, p), nom: p, couleur: SERIE[i % SERIE.length] }))
    .filter(d => d.total > 0).sort((a, b) => b.total - a.total);

  return (
    <>
      <div className="card" style={{ padding: 18, marginBottom: 14 }}>
        <label className="lab">Plafond travaux — à ne pas dépasser</label>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <input className="field mono" inputMode="decimal" value={projet.plafond ?? ""}
            onChange={e => majProjet({ plafond: e.target.value.replace(",", ".") })}
            style={{ width: 150, textAlign: "right", fontSize: 19, fontWeight: 500 }} />
          <span style={{ flex: 1, fontSize: 15, color: C.mine }}>euros</span>
        </div>
        {plafond > 0 && (
          <div style={{ marginTop: 14, padding: 14, borderRadius: 12,
            background: Math.abs(ecart) < 1 ? C.vert + "1A" : ecart < 0 ? C.briquePale : C.cordeauPale }}>
            <span style={{ fontSize: 15, lineHeight: 1.55, color: ecart < 0 ? C.brique : C.ardoise }}>
              <strong className="num" style={{ fontSize: 16 }}>{eurCourt(affecte)}</strong> répartis sur tes postes.{" "}
              {Math.abs(ecart) < 1 ? "Ton enveloppe est entièrement affectée."
                : ecart > 0 ? <>Il te reste <strong className="num" style={{ fontSize: 16 }}>{eurCourt(ecart)}</strong> à affecter.</>
                : <>Tu as réparti <strong className="num" style={{ fontSize: 16 }}>{eurCourt(-ecart)}</strong> de plus que ton plafond.</>}
            </span>
          </div>
        )}
      </div>

      {donnees.length > 0 && (
        <div className="card" style={{ padding: 18, marginBottom: 14 }}>
          <div className="lab" style={{ marginBottom: 12 }}>Où part l'argent</div>
          <div style={{ display: "flex", gap: 18, alignItems: "center", flexWrap: "wrap" }}>
            <Donut data={donnees} size={168} />
            <div style={{ flex: 1, minWidth: 190, display: "grid", gap: 9 }}>
              {donnees.map(d => (
                <div key={d.nom} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ width: 14, height: 14, borderRadius: 5, background: d.couleur, flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 15 }}>{d.nom}</span>
                  <span className="num" style={{ fontSize: 15 }}>{eurCourt(d.total)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <div style={{ display: "grid", gap: 12 }}>
        {postes.map((poste, i) => {
          const col = SERIE[i % SERIE.length];
          const l = chiffrer(entrees, poste);
          const prevu = N(projet.prevus?.[poste]);
          const over = prevu > 0 && l.total > prevu;
          const base = Math.max(prevu, l.total, 1);
          const utilise = entrees.some(e => e.poste === poste);
          return (
            <div key={poste} className="card" style={{ padding: 16, background: col + "12", borderColor: col + "45" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                <span style={{ width: 16, height: 16, borderRadius: 6, background: col, flexShrink: 0 }} />
                <span style={{ flex: 1, fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700,
                  fontSize: 18, letterSpacing: "-.02em", color: col }}>{poste}</span>
                <input className="field mono" inputMode="decimal" placeholder="prévu"
                  value={projet.prevus?.[poste] ?? ""} onChange={ev => setPrevu(poste, ev.target.value)}
                  style={{ width: 108, padding: "9px 11px", fontSize: 16, textAlign: "right", borderColor: col + "55" }} />
                <button className="btn-ghost" disabled={utilise} onClick={() => retirer(poste)}
                  title={utilise ? "Des écritures utilisent ce poste" : "Retirer ce poste"}
                  style={{ padding: "8px 12px", fontSize: 14, background: "transparent" }}>×</button>
              </div>

              <div className="jauge" style={{ height: 20, background: "#fff", borderColor: col + "45" }}>
                <div className="jauge-paye" style={{ background: over ? C.brique : col, width: `${Math.min(100, (l.paye / base) * 100)}%` }} />
                <div className="jauge-eng" style={{
                  left: `${Math.min(100, (l.paye / base) * 100)}%`,
                  width: `${Math.max(0, Math.min(100 - (l.paye / base) * 100, (l.engage / base) * 100))}%`,
                  backgroundColor: (over ? C.brique : col) + "26",
                  backgroundImage: `repeating-linear-gradient(45deg, ${over ? C.brique : col} 0 3px, transparent 3px 7px)`,
                }} />
                {over && <div className="niveau" style={{ left: `${(prevu / base) * 100}%`, width: 2 }} />}
              </div>

              <div className="grid4" style={{ marginTop: 12 }}>
                <Cellule label="Prévu" val={prevu} />
                <Cellule label="Payé" val={l.paye} />
                <Cellule label="Engagé" val={l.engage} />
                <Cellule label={over ? "Dépassé de" : "Reste"} val={Math.abs(prevu - l.total)} rouge={over} />
              </div>

              {poste === "Imprévus" && l.total === 0 && prevu > 0 && (
                <p style={{ fontSize: 14, color: C.mine, lineHeight: 1.55, margin: "12px 0 0" }}>
                  Provision intacte. Cet argent n'est pas disponible : il attend la mauvaise surprise.
                </p>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        <input className="field" placeholder="Ajouter un poste (Électricité, Plomberie…)"
          value={nouveau} onChange={e => setNouveau(e.target.value)}
          onKeyDown={e => e.key === "Enter" && ajouter()} style={{ flex: 1 }} />
        <button className="btn" onClick={ajouter} disabled={!nouveau.trim()}>Ajouter</button>
      </div>
    </>
  );
}

function Cellule({ label, val, rouge }) {
  return (
    <div className="cellule">
      <span style={{ display: "block", fontSize: 12.5, fontWeight: 500, color: rouge ? C.brique : C.mine }}>{label}</span>
      <span className="num" style={{ fontSize: 18, display: "block", marginTop: 3, color: rouge ? C.brique : C.ardoise }}>
        {eurCourt(val)}
      </span>

}

/* ---------------------------------- Bilan */
function Bilan({ projet, entrees, plafond, majProjet }) {
  const acq = projet.acquisition || [];
  const manquant = acq.filter(a => !String(a.montant).trim());
  const totalAcq = acq.reduce((s,a) => s + N(a.montant), 0);
  const t = chiffrer(entrees);
  const revient = totalAcq + t.total;
  const revientMax = totalAcq + Math.max(plafond, t.total);
  const setLigne = (id,k,v) => majProjet({ acquisition: acq.map(a => a.id===id ? { ...a, [k]: k==="montant"?v.replace(",","."):v } : a) });
  const ajouter = () => majProjet({ acquisition: [...acq, { id:uid(), libelle:"", montant:"" }] });
  const retirer = (id) => majProjet({ acquisition: acq.filter(a=>a.id!==id) });
  const barres = [
    ...acq.filter(a=>N(a.montant)>0).map((a,i)=>({ nom:a.libelle||"Sans libellé", val:N(a.montant), couleur:SERIE[i%3] })),
    { nom:"Travaux payés", val:t.paye, couleur:C.vert },
    { nom:"Travaux engagés", val:t.engage, couleur:"#7FC4AE" },
    { nom:"Travaux à venir", val:Math.max(0, plafond-t.total), couleur:C.trait },
  ].filter(b=>b.val>0);

  return (
    <>
      <div className="card" style={{ padding:16, marginBottom:14 }}>
        <div className="eyebrow">Coût de revient de l'opération</div>
        <div style={{ fontFamily:"'Bricolage Grotesque',sans-serif", fontWeight:800, fontSize:32,
          letterSpacing:"-.03em", margin:"4px 0 2px", fontVariantNumeric:"tabular-nums" }}>{eur(revient)}</div>
        <div className="num" style={{ fontSize:11.5, color:C.mine, lineHeight:1.5 }}>
          {eurCourt(revientMax)} si tu consommes tout ton plafond travaux
          {manquant.length>0 && <span style={{ color:C.brique }}> · {manquant.map(m=>m.libelle||"une ligne").join(", ")} : montant manquant</span>}
        </div>
        {barres.length>0 && <div style={{ marginTop:16 }}><BarreEmpilee data={barres} /></div>}
        <div style={{ display:"flex", flexWrap:"wrap", gap:"6px 14px", marginTop:10 }}>
          {barres.map(b => (
            <span key={b.nom} style={{ display:"flex", alignItems:"center", gap:5, fontSize:11, color:C.mine }}>
              <span style={{ width:10, height:10, borderRadius:3, background:b.couleur }} />{b.nom}
            </span>
          ))}
        </div>
      </div>

      <div className="card" style={{ marginBottom:12 }}>
        <div style={{ padding:"13px 14px", borderBottom:`1px solid ${C.trait}` }}>
          <span className="eyebrow">Acquisition — dépenses définitives</span>
        </div>
        {acq.map(a => (
          <div key={a.id} style={{ display:"flex", gap:8, padding:"10px 14px", borderTop:`1px solid ${C.trait}`, alignItems:"center" }}>
            <input className="field" value={a.libelle} placeholder="Libellé"
              onChange={e=>setLigne(a.id,"libelle",e.target.value)} style={{ flex:1, padding:"7px 10px", fontSize:13.5 }} />
            <input className="field mono" inputMode="decimal" value={a.montant} placeholder="0"
              onChange={e=>setLigne(a.id,"montant",e.target.value)}
              style={{ width:116, padding:"7px 10px", fontSize:13, textAlign:"right",
                borderColor: String(a.montant).trim() ? C.trait : C.brique }} />
            <button className="btn-ghost" onClick={()=>retirer(a.id)} style={{ padding:"6px 10px", fontSize:12 }}>×</button>
          </div>
        ))}
        <div style={{ display:"flex", padding:"11px 14px", borderTop:`2px solid ${C.ardoise}`, alignItems:"center" }}>
          <span className="h2" style={{ flex:1, fontSize:13 }}>Total acquisition</span>
          <span className="num" style={{ fontSize:15 }}>{eur(totalAcq)}</span>
        </div>
      </div>
      <button className="btn-ghost" onClick={ajouter} style={{ marginBottom:14 }}>Ajouter une ligne d'acquisition</button>

      <div className="card" style={{ padding:14 }}>
        <div className="eyebrow" style={{ marginBottom:10 }}>Travaux — enveloppe de {eurCourt(plafond)}</div>
        <div className="grid4">
          <Cellule label="Plafond" val={plafond} />
          <Cellule label="Payé" val={t.paye} />
          <Cellule label="Engagé" val={t.engage} />
          <Cellule label={plafond-t.total<0 ? "Dépassé de" : "Disponible"} val={Math.abs(plafond-t.total)} rouge={plafond-t.total<0} />
        </div>
        <p style={{ fontSize:12, color:C.mine, lineHeight:1.55, margin:"12px 0 0" }}>
          L'acquisition et les travaux restent séparés : l'achat est derrière toi, l'enveloppe travaux
          est la seule où tu décides encore.
        </p>
      </div>
    </>
  );
}


/* ---------------------------------- Patrimoine

const CAT_PAT = [

  ["PEL / CEL", "#6F9440", 90],

  ["Cryptomonnaies", "#DE5B3B", 7],
  ["Autres", "#D4587A", 180],
];
const catInfo = (c) => CAT_PAT.find(x => x[0] === c) || CAT_PAT[CAT_PAT.length - 1];
const joursDepuis = (d) => { try { return Math.floor((Date.now() - new Date(d + "T12:00").getTime()) / 864e5); } catch { return null; } };

        <p style={{ fontSize: 13.5, lineHeight: 1.5, margin: "12px 0 0", color: "rgba(255,255,255,.85)" }}>

            : `Somme de ce que tu as saisi, à la date où tu l'as saisi. ${perimes.length} ligne${perimes.length > 1 ? "s ont" : " a"} vieilli : ce total est faux d'autant.`}

function Repartition({ projet }) {
  const comptes = projet.comptes || [];
  const parCat = CAT_PAT.map(([nom, couleur]) => ({
    nom, couleur,
    total: comptes.filter(c => c.categorie === nom).reduce((s, c) => s + N(c.montant), 0),
  })).filter(d => d.total > 0).sort((a, b) => b.total - a.total);
  const total = parCat.reduce((s, d) => s + d.total, 0);

  if (!parCat.length) return (
    <div className="card" style={{ padding: 32, textAlign: "center" }}>
      <div className="h2" style={{ marginBottom: 8 }}>Rien à répartir</div>
      <p style={{ fontSize: 15, color: C.mine, lineHeight: 1.6, margin: 0 }}>Ajoute tes avoirs dans l'onglet précédent.</p>
    </div>
  );

  return (
    <>
      <div className="card" style={{ padding: 18, marginBottom: 14 }}>
        <div className="lab" style={{ marginBottom: 12 }}>Répartition de vos avoirs</div>
        <div style={{ display: "flex", gap: 18, alignItems: "center", flexWrap: "wrap" }}>
          <Donut data={parCat} size={168} />
          <div style={{ flex: 1, minWidth: 190, display: "grid", gap: 9 }}>
            {parCat.map(d => (
              <div key={d.nom} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ width: 14, height: 14, borderRadius: 5, background: d.couleur, flexShrink: 0 }} />
                <span style={{ flex: 1, fontSize: 15 }}>{d.nom}</span>
                <span className="num" style={{ fontSize: 15 }}>{eurCourt(d.total)}</span>
                <span className="num" style={{ fontSize: 13, color: C.mine, width: 42, textAlign: "right" }}>
                  {Math.round((d.total / total) * 100)} %
                </span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="card" style={{ padding: 16 }}>
        <div className="lab" style={{ marginBottom: 8 }}>Ce que ce graphique ne dit pas</div>
        <p style={{ fontSize: 14, lineHeight: 1.6, margin: 0, color: C.mine }}>
          Il additionne des choses qui ne se valent pas. Un livret est disponible demain ; une assurance vie
          demande des semaines ; un PEL se casse avec des conséquences ; une crypto peut perdre un tiers pendant
          que tu lis cette phrase. Un même euro n'a pas la même valeur selon la ligne où il se trouve.
          Ce n'est ni un bilan comptable ni un conseil — je ne suis pas ton conseiller financier.
        </p>
      </div>
    </>
  );
}

function Projets({ projets, actif, setActif, maj, entrees, projet, majProjet, setErreur, onDeco, onChangerCarnet }) {

    if (!nom.trim()) return;
    const p = { id:uid(), nom:nom.trim(), type, plafond:"", acquisition:[], comptes:[],

  };

  const exporterCSV = () => {
    const l = [["date","type","statut","libelle","fournisseur","poste","moyen","montant"]];
    entrees.forEach(e => l.push([e.date,e.type,e.statut||"",e.libelle,e.fournisseur,e.poste,e.moyen,N(e.montant)]));
    l.push([]); l.push(["ACQUISITION","","","","","","",""]);
    (projet.acquisition||[]).forEach(a => l.push(["","acquisition","",a.libelle,"","","",N(a.montant)]));
    const csv = l.map(r => r.map(c => `"${String(c ?? "").replace(/"/g,'""')}"`).join(";")).join("\n");
    telecharger(new Blob(["\uFEFF"+csv], { type:"text/csv;charset=utf-8" }),
      `${projet.nom.replace(/\W+/g,"-").toLowerCase()}-${today()}.csv`);
  };

  const exporterJSON = async () => {
    setDit("Export en cours…");
    const paquet = { version: 2, exporte: new Date().toISOString(), carnet: CARNET_INFO?.nom, projets, entrees: {}, photos: {} };
    for (const p of projets) {
      const l = await sGet(kEntrees(p.id), []);
      paquet.entrees[p.id] = l;
      for (const e of l) if (e.photo) { const ph = await brut.get(kPhoto(e.id)); if (ph) paquet.photos[e.id] = ph; }
    }
    telecharger(new Blob([JSON.stringify(paquet)], { type: "application/json" }), `carnet-de-chantier-${today()}.json`);
    setDit("");
  };

  const importerJSON = async (f) => {
    if (!f) return;
    try {
      const p = JSON.parse(await f.text());
      if (!p.projets || !p.entrees) throw new Error("format");

      await supa.from("donnees").delete().eq("carnet_id", CARNET);
      await supa.from("pieces").delete().eq("carnet_id", CARNET);
      await sSet(K_PROJETS, p.projets);
      for (const [id, v] of Object.entries(p.entrees)) await sSet(kEntrees(id), v);
      for (const [id, v] of Object.entries(p.photos || {})) await brut.set(kPhoto(id), v);
      window.location.reload();

            <span style={{ flex:1 }}>
              <span className="h2" style={{ fontSize:14 }}>{p.nom}</span>

                {N(p.plafond)>0 && ` · plafond ${eurCourt(N(p.plafond))}`}

            </span>
            {p.id===actif && <span className="tag" style={{ background:C.cordeauPale, color:C.cordeau, border:`1px solid ${C.cordeau}` }}>Actif</span>}
          </button>

      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div className="eyebrow" style={{ marginBottom:8 }}>Lecture des factures par Claude</div>
        <p style={{ fontSize:12.5, color:C.mine, lineHeight:1.55, margin:"0 0 10px" }}>

          Avec une clé, Claude lit tes photos et tes PDF et remplit les champs tout seul.
          <strong style={{ color:C.ardoise }}> La clé reste sur cet appareil</strong>, elle n'est ni dans le fichier ni partagée.
          Chaque lecture t'est facturée quelques centimes par Anthropic.
        </p>
        <input className="field mono" type="password" placeholder="sk-ant-…" value={k}
          onChange={e=>setK(e.target.value)} style={{ marginBottom:8, fontSize:13 }} />
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          <button className="btn-ghost" onClick={()=>{ brut.set(K_CLE, k.trim()); setDit("Clé enregistrée sur cet appareil."); setTimeout(()=>setDit(""),2500); }}>
            Enregistrer la clé
          </button>
          <button className="btn-ghost" onClick={()=>{ brut.del(K_CLE); setK(""); setDit("Clé effacée."); setTimeout(()=>setDit(""),2500); }}>
            Effacer
          </button>
          {dit && <span style={{ fontSize:12, color:C.vert }}>{dit}</span>}
        </div>
      </div>

      <div className="card" style={{ padding: 16, marginBottom: 14 }}>
        <div className="lab" style={{ marginBottom: 8 }}>Partager ce carnet</div>
        <p style={{ fontSize: 14, color: C.mine, lineHeight: 1.6, margin: "0 0 12px" }}>

        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>

function telecharger(blob, nom) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nom; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 20000);
}

function Editeur({ entree, postes, entrees, devis, onFermer, onEnregistrer, onSupprimer }) {
  const vide = { id:uid(), date:today(), libelle:"", fournisseur:"", montant:"", moyen:"CB",
    poste:postes[0], type:"depense", statut:"signe", note:"", lie:"", photo:false, echeance:"" };
  const [e, setE] = useState(entree || vide);
  const [dictee, setDictee] = useState("");
  const [charge, setCharge] = useState("");
  const [pb, setPb] = useState("");
  const [photo, setPhoto] = useState(null);
  const refCam = useRef(null), refFile = useRef(null);
  const estPdf = typeof photo === "string" && photo.startsWith("data:application/pdf");
  const aCle = !!cle();
  const set = (k,v) => setE(p => ({ ...p, [k]:v }));

  useEffect(() => {
    if (entree?.photo) { (async () => { const v = await brut.get(kPhoto(entree.id)); if (v) setPhoto(v); })(); }
  }, [entree]);

  const appliquer = (d) => setE(p => ({ ...p,
    date: d.date || p.date, libelle: d.libelle || p.libelle, fournisseur: d.fournisseur || p.fournisseur,
    montant: d.montant ? String(d.montant) : p.montant,
    moyen: MOYENS.includes(d.moyen) ? d.moyen : p.moyen,
    poste: postes.includes(d.poste) ? d.poste : p.poste,
    type: d.type === "devis" ? "devis" : p.type,
  }));

  const erreurClaude = (err) => {
    const m = String(err?.message || "");
    if (m === "no-key") return "Ajoute ta clé API dans l'onglet Projets pour que Claude lise tes documents.";
    if (m === "api-401") return "Ta clé API est refusée. Vérifie-la dans l'onglet Projets.";
    if (m === "api-429") return "Trop de demandes d'un coup. Réessaie dans un instant.";
    return "La lecture a échoué. Remplis les champs à la main.";
  };

  const lireDictee = async () => {
    if (!dictee.trim()) return;
    setCharge("dictee"); setPb("");
    try { appliquer(await claude([{ role:"user", content:`${CONSIGNE(postes)}\n\nTexte : "${dictee}"` }])); setDictee(""); }
    catch (err) { setPb(erreurClaude(err)); }
    setCharge("");
  };

  const choisirPiece = async (f) => {
    if (!f) return;
    setCharge("photo"); setPb("");
    try {
      const pdf = f.type === "application/pdf";
      const b64 = pdf ? await lireBrut(f) : await compresser(f);
      if (b64.length > 3_800_000) {
        setPb(`Ce fichier est trop lourd (${(f.size/1e6).toFixed(1)} Mo) pour le stockage du navigateur. Garde-le dans ton cloud et colle le lien dans la note.`);
        setCharge(""); return;
      }
      setPhoto(b64);
      if (!aCle) { setCharge(""); return; }
      const data = b64.split(",")[1];
      try {
        appliquer(await claude([{ role:"user", content:[
          pdf ? { type:"document", source:{ type:"base64", media_type:"application/pdf", data } }
              : { type:"image", source:{ type:"base64", media_type:"image/jpeg", data } },
          { type:"text", text:`${CONSIGNE(postes)}\n\nLis cette facture ou ce devis et extrais l'écriture. Retiens le montant TTC net à payer.` },
        ] }]));
      } catch (err) { setPb("La pièce est jointe, mais " + erreurClaude(err).toLowerCase()); }
    } catch { setPb("Ce fichier n'a pas pu être traité. Réessaie."); }
    setCharge("");
  };

  const enregistrer = async () => {
    setCharge("save");
    try {
      if (photo) await brut.set(kPhoto(e.id), photo); else await brut.del(kPhoto(e.id));
      await onEnregistrer({ ...e, montant:N(e.montant), photo: !!photo });
    } catch { setPb("Enregistrement impossible — le stockage du navigateur est probablement plein."); setCharge(""); }
  };

  return (
    <div className="sheet" onClick={ev => ev.target===ev.currentTarget && onFermer()}>
      <div className="sheet-in">
        <div style={{ position:"sticky", top:0, background:C.platre, padding:"16px 16px 10px",
          borderBottom:`1px solid ${C.trait}`, display:"flex", alignItems:"center", gap:10, zIndex:2 }}>
          <span className="h2" style={{ flex:1 }}>{entree ? "Modifier l'écriture" : "Nouvelle écriture"}</span>
          <button className="btn-ghost" onClick={onFermer}>Annuler</button>
        </div>

        <div style={{ padding:16 }}>
          {!entree && (
            <div className="card" style={{ padding:13, marginBottom:14, borderColor:C.cordeau }}>
              <label className="lab">Saisie rapide — dicte avec le micro de ton clavier</label>
              <textarea className="field" rows={2} value={dictee} onChange={ev=>setDictee(ev.target.value)}
                placeholder="tringle à rideau chez Leroy Merlin 14,95 réglé par CB aujourd'hui"
                style={{ resize:"vertical", marginBottom:8 }} />
              <div style={{ display:"flex", gap:8 }}>
                <button className="btn-blue" onClick={lireDictee} disabled={!dictee.trim()||!!charge} style={{ flex:1 }}>
                  {charge==="dictee" ? <><span className="spin" /> Lecture…</> : "Remplir les champs"}
                </button>
                <button className="btn-ghost" onClick={()=>refFile.current?.click()} disabled={!!charge}>
                  {charge==="photo" ? <><span className="spin" /> Lecture…</> : "Joindre la facture"}
                </button>
              </div>
              {!aCle && <p style={{ fontSize:11.5, color:C.mine, margin:"9px 0 0", lineHeight:1.5 }}>
                Sans clé API, la saisie rapide ne fonctionne pas. Remplis les champs ci-dessous, ou ajoute ta clé dans l'onglet Projets.
              </p>}
            </div>
          )}
          <input ref={refCam} type="file" accept="image/*" capture="environment" style={{ display:"none" }}
            onChange={ev=>{ choisirPiece(ev.target.files?.[0]); ev.target.value=""; }} />
          <input ref={refFile} type="file" accept="image/*,application/pdf" style={{ display:"none" }}
            onChange={ev=>{ choisirPiece(ev.target.files?.[0]); ev.target.value=""; }} />

          {pb && <div style={{ fontSize:12.5, color:C.brique, marginBottom:12, lineHeight:1.45 }}>{pb}</div>}

          <div style={{ display:"grid", gap:12 }}>
            <div style={{ display:"flex", gap:10 }}>
              <div style={{ flex:1 }}>
                <label className="lab">Montant TTC</label>
                <input className="field mono" inputMode="decimal" value={e.montant}
                  onChange={ev=>set("montant",ev.target.value)} placeholder="0,00" />
              </div>
              <div style={{ flex:1 }}>
                <label className="lab">Date</label>
                <input className="field mono" type="date" value={e.date} onChange={ev=>set("date",ev.target.value)} />
              </div>
            </div>
            <div>
              <label className="lab">Libellé</label>
              <input className="field" value={e.libelle} onChange={ev=>set("libelle",ev.target.value)} placeholder="Tringle à rideau" />
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <div style={{ flex:1 }}>
                <label className="lab">Fournisseur</label>
                <input className="field" value={e.fournisseur} onChange={ev=>set("fournisseur",ev.target.value)} placeholder="Leroy Merlin" />
              </div>
              <div style={{ flex:1 }}>
                <label className="lab">Poste</label>
                <select className="field" value={e.poste} onChange={ev=>set("poste",ev.target.value)}>
                  {postes.map(p => <option key={p}>{p}</option>)}
                </select>
              </div>
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <div style={{ flex:1 }}>
                <label className="lab">Nature</label>
                <select className="field" value={e.type} onChange={ev=>set("type",ev.target.value)}>
                  <option value="depense">Dépense payée</option>
                  <option value="devis">Devis</option>
                </select>
              </div>
              <div style={{ flex:1 }}>
                <label className="lab">{e.type==="devis" ? "Statut" : "Payé par"}</label>
                {e.type==="devis" ? (
                  <select className="field" value={e.statut} onChange={ev=>set("statut",ev.target.value)}>
                    <option value="signe">Signé — compte dans l'engagé</option>
                    <option value="attente">En attente — ne compte pas</option>
                  </select>
                ) : (
                  <select className="field" value={e.moyen} onChange={ev=>set("moyen",ev.target.value)}>
                    {MOYENS.map(m => <option key={m}>{m}</option>)}

            </div>

            {e.type==="devis" && e.statut==="signe" && (
              <div>
                <label className="lab">Échéance du solde (facultatif)</label>
                <input className="field mono" type="date" value={e.echeance||""} onChange={ev=>set("echeance",ev.target.value)} />
                <p style={{ fontSize:12, color:C.mine, margin:"7px 0 0", lineHeight:1.5 }}>

                </p>
              </div>

            {e.type==="depense" && devis.length>0 && (
              <div>
                <label className="lab">Acompte sur un devis signé</label>

                  const d = devis.find(x=>x.id===ev.target.value);

                  <option value="">Dépense indépendante</option>
                  {devis.map(d => (

                </select>
                {e.lie && (() => {

                  if (!d) return null;

            <div>
              <label className="lab">Note</label>

            <div>

          <div style={{ display:"flex", gap:8, marginTop:20, paddingBottom:"env(safe-area-inset-bottom)" }}>

        </div>

/* ---------------------------------- pièces jointes */
function lireBrut(file) {
  return new Promise((res,rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error("read"));
    fr.readAsDataURL(file);
  });
}
function ouvrirPdf(dataUrl) {
  try {
    const bin = atob(dataUrl.split(",")[1]);
    const buf = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    telecharger(new Blob([buf], { type:"application/pdf" }), "justificatif.pdf");
  } catch {}
}
function compresser(file) {
  return new Promise((res,rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1500;
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width*r); cv.height = Math.round(img.height*r);
        const cx = cv.getContext("2d");
        cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = () => rej(new Error("image"));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error("read"));
    fr.readAsDataURL(file);
  });
}

function Config({ onOk }) {
  const c = cfg() || {};
  const [url, setUrl] = useState(c.url || "");
  const [key, setKey] = useState(c.key || "");
  const [pb, setPb] = useState("");

  const valider = () => {
    const u = url.trim().replace(/\/$/, "");
    const k = key.trim();
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u)) return setPb("L'URL doit ressembler à https://abcdefgh.supabase.co — sans barre oblique à la fin.");
    if (k.length < 40) return setPb("La clé « anon public » est bien plus longue que ça. Reprends-la en entier.");
    setCfg({ url: u, key: k });
    onOk();
  };

  return (
    <Ecran titre="Brancher le carnet" sous="À faire une seule fois, sur chaque appareil. Ces deux informations restent sur ton téléphone.">
      <div className="card" style={{ padding: 18 }}>

        <ol style={{ fontSize: 14.5, lineHeight: 1.75, color: C.ardoise, margin: "0 0 16px", paddingLeft: 20 }}>
          <li>Va sur <strong>supabase.com</strong>, crée un compte gratuit.</li>
          <li>Crée un projet. Note bien le mot de passe qu'il te demande.</li>
          <li>Ouvre <strong>SQL Editor</strong>, colle le fichier <strong>base-de-donnees.sql</strong> en entier, clique sur <strong>Run</strong>.</li>
          <li>Va dans <strong>Settings → API</strong>, et recopie les deux valeurs ci-dessous.</li>
        </ol>
        <label className="lab">URL du projet</label>
        <input className="field" value={url} onChange={e => setUrl(e.target.value)}
          placeholder="https://abcdefgh.supabase.co" style={{ marginBottom: 12, fontSize: 14 }} />
        <label className="lab">Clé « anon public »</label>
        <textarea className="field" rows={3} value={key} onChange={e => setKey(e.target.value)}
          placeholder="eyJhbGciOi…" style={{ marginBottom: 8, fontSize: 13, resize: "vertical" }} />
        <p style={{ fontSize: 12.5, color: C.mine, lineHeight: 1.55, margin: "0 0 16px" }}>
          Prends bien <strong>anon public</strong>, jamais <strong>service_role</strong> : celle-là ouvrirait tout à tout le monde.
        </p>
        <button className="btn-blue" onClick={valider} style={{ width: "100%" }}>Continuer</button>
      </div>
    </Ecran>
  );
}

function Connexion({ onOk, onReconfig }) {
  const [mode, setMode] = useState("entrer");
  const [mail, setMail] = useState("");
  const [mdp, setMdp] = useState("");
  const [pb, setPb] = useState("");
  const [attend, setAttend] = useState(false);

  const go = async () => {
    setPb(""); setAttend(true);
    try {
      const f = mode === "entrer" ? supa.auth.signInWithPassword({ email: mail.trim(), password: mdp })
                                  : supa.auth.signUp({ email: mail.trim(), password: mdp });
      const { data, error } = await f;
      if (error) throw error;
      if (!data.session) setPb("Compte créé. Confirme ton adresse par mail, puis reviens te connecter. (Tu peux désactiver cette étape dans Supabase → Authentication → Sign In / Providers → décoche « Confirm email ».)");
      else onOk();
    } catch (e) {
      const m = String(e.message || "");
      setPb(m.includes("Invalid login") ? "Adresse ou mot de passe incorrect."
        : m.includes("already registered") ? "Cette adresse a déjà un compte. Passe par « J'ai déjà un compte »."
        : m.includes("at least") ? "Le mot de passe doit faire au moins 6 caractères."
        : m.includes("Failed to fetch") ? "Impossible de joindre le serveur. Vérifie l'URL dans les réglages, et ta connexion."
        : m);
    }
    setAttend(false);
  };

  return (
    <Ecran titre={mode === "entrer" ? "Se connecter" : "Créer un compte"}
      sous="Thomas et toi avez chacun le vôtre. Vous partagerez le même carnet.">
      <div className="card" style={{ padding: 18 }}>
        <Alerte>{pb}</Alerte>
        <label className="lab">Adresse mail</label>
        <input className="field" type="email" autoComplete="email" value={mail}
          onChange={e => setMail(e.target.value)} style={{ marginBottom: 12 }} />
        <label className="lab">Mot de passe</label>
        <input className="field" type="password" value={mdp}
          autoComplete={mode === "entrer" ? "current-password" : "new-password"}
          onChange={e => setMdp(e.target.value)}
          onKeyDown={e => e.key === "Enter" && go()} style={{ marginBottom: 16 }} />
        <button className="btn-blue" onClick={go} disabled={attend || !mail.trim() || mdp.length < 6} style={{ width: "100%" }}>
          {attend ? <><span className="spin" /> …</> : mode === "entrer" ? "Entrer" : "Créer mon compte"}
        </button>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 14, gap: 8 }}>
          <button className="btn-ghost" onClick={() => { setMode(mode === "entrer" ? "creer" : "entrer"); setPb(""); }}>
            {mode === "entrer" ? "Créer un compte" : "J'ai déjà un compte"}
          </button>
          <button className="btn-ghost" onClick={onReconfig}>Réglages</button>
        </div>
      </div>
    </Ecran>
  );
}

function ChoixCarnet({ onOk, onDeco }) {
  const [liste, setListe] = useState(null);
  const [nom, setNom] = useState("Notre carnet");
  const [code, setCode] = useState("");
  const [pb, setPb] = useState("");
  const [attend, setAttend] = useState(false);

  const charger = async () => {
    const { data, error } = await supa.rpc("mes_carnets");
    if (error) { setPb("Le script SQL n'a pas dû être exécuté. Reprends l'étape 3 des réglages. (" + error.message + ")"); setListe([]); }
    else setListe(data || []);
  };
  useEffect(() => { charger(); }, []);

  const creer = async () => {
    setAttend(true); setPb("");
    const { data, error } = await supa.rpc("creer_carnet", { p_nom: nom.trim() });
    setAttend(false);
    if (error) return setPb(error.message);
    onOk(data[0]);
  };
  const rejoindre = async () => {
    setAttend(true); setPb("");
    const { data, error } = await supa.rpc("rejoindre_carnet", { p_code: code.trim() });
    setAttend(false);
    if (error) return setPb(error.message.includes("aucun carnet") ? "Ce code ne correspond à aucun carnet. Vérifie avec Thomas." : error.message);
    onOk(data[0]);
  };

  if (liste === null) return <Ecran titre="Un instant"><div style={{ textAlign: "center" }}><span className="spin" /></div></Ecran>;

  return (
    <Ecran titre="Ton carnet" sous="Crée-le, ou rejoins celui que l'autre a déjà créé.">
      <Alerte>{pb}</Alerte>

      {liste.length > 0 && (
        <div className="card" style={{ marginBottom: 14 }}>
          {liste.map(c => (
            <button key={c.id} className="row" onClick={() => onOk(c)}>
              <span style={{ flex: 1 }}>
                <span className="h2">{c.nom}</span>
                <span className="num" style={{ display: "block", fontSize: 13, color: C.mine, marginTop: 3 }}>code {c.code}</span>
              </span>
              <span className="pill" style={{ background: C.cordeauPale, color: C.cordeau }}>Ouvrir</span>
            </button>
          ))}
        </div>
      )}

      <div className="card" style={{ padding: 16, marginBottom: 14 }}>
        <div className="lab">Créer un carnet</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input className="field" value={nom} onChange={e => setNom(e.target.value)} style={{ flex: 1 }} />
          <button className="btn" onClick={creer} disabled={attend || !nom.trim()}>Créer</button>
        </div>
      </div>

      <div className="card" style={{ padding: 16, marginBottom: 14 }}>
        <div className="lab">Rejoindre avec un code</div>
        <div style={{ display: "flex", gap: 8 }}>
          <input className="field mono" value={code} onChange={e => setCode(e.target.value)}
            placeholder="a1b2c3d4" style={{ flex: 1 }} onKeyDown={e => e.key === "Enter" && rejoindre()} />
          <button className="btn" onClick={rejoindre} disabled={attend || !code.trim()}>Rejoindre</button>
        </div>
      </div>

      <button className="btn-ghost" onClick={onDeco}>Se déconnecter</button>
    </Ecran>
  );
}

function Racine() {
  const [etape, setEtape] = useState("boot");

  const suite = async () => {
    if (!ouvrirSupa()) return setEtape("config");
    const { data } = await supa.auth.getSession();
    if (!data.session) return setEtape("connexion");
    const memo = localStorage.getItem("cdc:carnet");
    if (memo) {
      try {
        const c = JSON.parse(memo);
        const { data: l } = await supa.rpc("mes_carnets");
        if ((l || []).some(x => x.id === c.id)) { CARNET = c.id; CARNET_INFO = c; return setEtape("pret"); }
      } catch {}
    }
    setEtape("carnet");
  };
  useEffect(() => { suite(); }, []);

  const choisir = (c) => {
    CARNET = c.id; CARNET_INFO = c;
    localStorage.setItem("cdc:carnet", JSON.stringify(c));
    setEtape("pret");
  };
  const deconnecter = async () => {
    await supa.auth.signOut();
    localStorage.removeItem("cdc:carnet");
    CARNET = null; CARNET_INFO = null;
    setEtape("connexion");
  };

  if (etape === "boot") return <Ecran titre="Carnet de chantier"><div style={{ textAlign: "center" }}><span className="spin" /></div></Ecran>;
  if (etape === "config") return <Config onOk={() => { supa = null; suite(); }} />;
  if (etape === "connexion") return <Connexion onOk={suite} onReconfig={() => setEtape("config")} />;
  if (etape === "carnet") return <ChoixCarnet onOk={choisir} onDeco={deconnecter} />;
  return <App onDeco={deconnecter} onChangerCarnet={() => setEtape("carnet")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Racine />);
